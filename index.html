
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igor Bogdanov - UI/UX Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Подключение Inter — золотого стандарта современных интерфейсов -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0a0a0a;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Устанавливаем Inter как основной шрифт для всех элементов */
        h1, h2, h3, h4, h5, h6, p, span, a, button, div {
            font-family: 'Inter', sans-serif !important;
            letter-spacing: -0.01em; /* Легкий отрицательный кернинг для Inter делает его более премиальным */
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 65s linear infinite;
        }
        /* Custom cursor styling */
        .custom-cursor {
            mix-blend-mode: difference;
        }
    </style>
<script type="importmap">
